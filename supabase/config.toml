# Konfigurasi Supabase lokal. Kunci yang tidak ditulis memakai nilai bawaan Supabase CLI.
# Lihat https://supabase.com/docs/guides/local-development/cli/config
project_id = "jejak-anggaran"

[api]
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[inbucket]
# Email magic link lokal bisa dilihat di http://127.0.0.1:54324
port = 54324

[storage]
file_size_limit = "5MiB"

[auth]
site_url = "http://localhost:5173"
# Project remote diatur di Dashboard → Authentication → URL Configuration: Site URL = domain produksi, dan
# Redirect URLs memuat domain produksi + localhost. Tanpa itu, tautan masuk jatuh ke Site URL (localhost).
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**", "https://jejak-anggaran.vercel.app/**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
